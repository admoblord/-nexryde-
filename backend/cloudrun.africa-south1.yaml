##############################################################################
# NEXRYDE Backend — africa-south1 (Johannesburg / Lagos-adjacent)
#
# Deploy AFTER Redis + Kafka in africa-south1 are READY:
#   gcloud run services replace backend/cloudrun.africa-south1.yaml \
#     --region africa-south1
#
# Keep us-central1 running until DNS / app config points here.
##############################################################################

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nexryde-backend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        # Keep one warm instance + always-allocated CPU so tab switches /
        # reverse-geocode never pay a cold start or CPU-thaw delay after idle.
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/startup-cpu-boost: "true"
        # false = CPU always allocated (required for snappy Redis/Mongo under load)
        run.googleapis.com/cpu-throttling: "false"
        # Private access to Memorystore Redis for rate limits, realtime fanout, and polling cache.
        run.googleapis.com/vpc-access-connector: "projects/nexryde-app/locations/africa-south1/connectors/nexryde-vpc"
        run.googleapis.com/vpc-access-egress: "all-traffic"  # required: Atlas allowlisted to NAT 34.35.108.112 only
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: africa-south1-docker.pkg.dev/nexryde-app/nexryde-backend/nexryde-backend:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 1Gi

          # ── All env vars in one flat list ─────────────────────────────────
          env:
            # Non-sensitive plain config
            - name: NEXRYDE_ENV
              value: production
            - name: NEXRYDE_SLOW_REQUEST_MS
              value: "800"
            # Dumps thread stacks when the loop blocks long enough for Cloud Run's
            # liveness probe to start missing (3 x 30s), so the culprit shows up in logs.
            - name: NEXRYDE_LOOP_WATCHDOG
              value: "1"
            - name: NEXRYDE_LOOP_STALL_MS
              value: "5000"
            - name: NEXRYDE_RESPONSE_TIME_HEADER
              value: "1"
            - name: DB_NAME
              value: nexryde_db
            - name: MONGO_MAX_POOL_SIZE
              value: "40"
            - name: NEXRYDE_REALTIME_PLATFORM
              value: "true"
            # Redis streams instead of Managed Kafka. The bus only carries trip
            # events between this service and nexryde-kafka-worker, which are
            # both already on Memorystore — a dedicated 3 vCPU Kafka cluster
            # billed hourly bought nothing at this volume. Set back to "kafka"
            # (and restore KAFKA_BOOTSTRAP_SERVERS below) if throughput ever
            # justifies it.
            - name: NEXRYDE_EVENT_BUS
              value: "redis"
            - name: NEXRYDE_OUTBOX_WORKER
              value: "false"
            # Run sagas in-request. Deferring to nexryde-kafka-worker only works
            # while that worker is warm, and it no longer is — so trip pushes,
            # stats and incentives would never run. Inline is also faster: the
            # rider's "Trip Completed" push no longer waits for a worker poll.
            # The scheduled maintenance tick still retries anything that fails.
            - name: NEXRYDE_SAGA_INLINE
              value: "true"
            - name: NEXRYDE_BATCH_MATCHING
              value: "true"
            - name: NEXRYDE_MATCH_BATCH_MS
              value: "800"
            - name: NEXRYDE_STREAM_SURGE
              value: "true"
            - name: NEXRYDE_SURGE_WINDOW_SEC
              value: "60"
            - name: NEXRYDE_GUARDIANS
              value: "true"
            - name: NEXRYDE_GUARDIAN_INTERVAL_SEC
              value: "20"
            # KAFKA_BOOTSTRAP_SERVERS intentionally unset — event_bus falls back
            # to Redis streams, and leaving it set would reconnect to a cluster
            # that no longer exists.
            - name: RT_HEARTBEAT_INTERVAL_SEC
              value: "20"
            - name: JWT_EXPIRY_HOURS
              value: "24"
            - name: ADMIN_SESSION_TTL_HOURS
              value: "8"
            - name: ADMIN_MFA_REQUIRED
              value: "true"
            # Emergency SMS: after creating Secret Manager TERMII_API_KEY, add:
            #   - name: TERMII_API_KEY
            #     valueFrom: { secretKeyRef: { name: TERMII_API_KEY, key: latest } }
            #   - name: SMS_PROVIDER
            #     value: "termii"
            - name: TERMII_SENDER_ID
              value: "NEXRYDE"
            # Optional: comma-separated IPs (Cloud Run sees X-Forwarded-For). Empty = allow all.
            - name: ADMIN_IP_WHITELIST
              value: ""
            - name: ADMIN_EMAIL
              value: admin@admoblordgroup.com
            - name: CORS_ORIGINS
              value: "https://nexryde.app,https://admin.nexryde.app,exp://,nexryde://"
            # Live Squad API host is api-d.squadco.com (api.squadco.com returns 403 and breaks checkout).
            - name: SQUAD_BASE_URL
              value: "https://api-d.squadco.com"
            - name: SQUAD_CHECKOUT_BASE_URL
              value: "https://pay.squadco.com"
            - name: NEXRYDE_PUBLIC_BACKEND_URL
              value: "https://nexryde-backend-993913300770.africa-south1.run.app"
            - name: SQUAD_DLQ_AUTOREPLAY
              value: "1"
            # Trusted hosts — Host-header spoofing guard (comma-separated, no scheme)
            - name: TRUSTED_HOSTS
              value: "nexryde-backend-993913300770.africa-south1.run.app,nexryde-backend-pkzkptjzba-bq.a.run.app,nexryde.app,admin.nexryde.app"
            # NIN: NEXRYDE-only verification (no government registry delay). Set NIN_REGISTRY_ENABLED=true to opt in later.
            - name: NIN_REGISTRY_ENABLED
              value: "false"
            - name: WORK_ZONE_ENABLED
              value: "false"
            - name: WORK_ZONE_ROLLOUT_MODE
              value: "FOUNDING_DRIVERS_ONLY"
            - name: WORK_ZONE_MAX_ZONED_SHARE
              value: "0.3"
            - name: WORK_ZONE_MIN_ONLINE_DRIVERS
              value: "1"
            - name: WORK_ZONE_EARLY_ACCESS_EMAILS
              value: "loopy9ice@gmail.com,timothy_okunola@yahoo.com"
            - name: ENGAGEMENT_LOOP_ENABLED
              value: "true"
            - name: ENGAGEMENT_MAX_PER_DAY
              value: "2"
            - name: ENGAGEMENT_MIN_HOURS_BETWEEN
              value: "6"
            - name: ENGAGEMENT_QUIET_HOURS_START
              value: "22"
            - name: ENGAGEMENT_QUIET_HOURS_END
              value: "7"
            # Private driver document binaries (admin View / Download).
            - name: GCS_MEDIA_BUCKET
              value: "nexryde-media"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/secrets/firebase/firebase-service-account.json"

            # Secrets from Secret Manager
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: JWT_SECRET
                  key: latest
            - name: NIN_FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: NIN_FERNET_KEY
                  key: latest
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: MONGODB_URI
                  key: latest
            - name: SQUAD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: SQUAD_SECRET_KEY
                  key: latest
            - name: SQUAD_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: SQUAD_PUBLIC_KEY
                  key: latest
            - name: SQUAD_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: SQUAD_WEBHOOK_SECRET
                  key: latest
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ADMIN_PASSWORD
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: REDIS_URL_AFRICA
                  key: latest
            - name: BREVO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: BREVO_API_KEY
                  key: latest
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_MAPS_API_KEY
                  key: latest
            - name: NEXRYDE_OPS_KEY
              valueFrom:
                secretKeyRef:
                  name: NEXRYDE_OPS_KEY
                  key: latest
            - name: ADMIN_OPS_KEY
              valueFrom:
                secretKeyRef:
                  name: ADMIN_OPS_KEY
                  key: latest
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: SENTRY_DSN
                  key: latest

          volumeMounts:
            - name: firebase-service-account
              mountPath: /secrets/firebase
              readOnly: true

          # Health checks take ~0.5s when healthy; 1s defaults kill instances
          # under Mongo/VPC blips and surface as "No places found" / skeleton tabs.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24

      volumes:
        - name: firebase-service-account
          secret:
            secretName: FIREBASE_SERVICE_ACCOUNT_JSON
            items:
              - key: latest
                path: firebase-service-account.json
