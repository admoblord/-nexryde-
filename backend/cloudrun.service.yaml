##############################################################################
# NEXRYDE Backend — Cloud Run Service Definition
#
# Deploy with:
#   gcloud run services replace backend/cloudrun.service.yaml \
#     --region us-central1
#
# ── First-time Secret Manager setup ─────────────────────────────────────────
#
#   # 1. Create each secret (one-time):
#   for SECRET in JWT_SECRET MONGODB_URI SQUAD_SECRET_KEY SQUAD_PUBLIC_KEY \
#       SQUAD_WEBHOOK_SECRET ADMIN_PASSWORD REDIS_URL BREVO_API_KEY \
#       GOOGLE_MAPS_API_KEY NEXRYDE_OPS_KEY ADMIN_OPS_KEY SENTRY_DSN \
#       FIREBASE_SERVICE_ACCOUNT_JSON; do
#     gcloud secrets create $SECRET --replication-policy=automatic
#   done
#
#   # Sentry (required for prod YAML — create before next deploy):
#   echo -n "https://…@….ingest.sentry.io/…" | gcloud secrets versions add SENTRY_DSN --data-file=-
#
#   # 2. Populate values:
#   echo -n "$(openssl rand -hex 32)" | gcloud secrets versions add JWT_SECRET --data-file=-
#   echo -n "$(openssl rand -hex 32)" | gcloud secrets versions add NEXRYDE_OPS_KEY --data-file=-
#   echo -n "mongodb+srv://..."        | gcloud secrets versions add MONGODB_URI --data-file=-
#   # … repeat for each secret
#
#   # 3. Grant the Cloud Run service account read access:
#   PROJECT_ID=$(gcloud config get-value project)
#   SA=$(gcloud run services describe nexryde-backend --region us-central1 \
#         --format='value(spec.template.spec.serviceAccountName)')
#   for SECRET in JWT_SECRET MONGODB_URI SQUAD_SECRET_KEY SQUAD_PUBLIC_KEY \
#       SQUAD_WEBHOOK_SECRET ADMIN_PASSWORD REDIS_URL BREVO_API_KEY \
#       GOOGLE_MAPS_API_KEY NEXRYDE_OPS_KEY FIREBASE_SERVICE_ACCOUNT_JSON; do
#     gcloud secrets add-iam-policy-binding $SECRET \
#       --member="serviceAccount:${SA}" \
#       --role="roles/secretmanager.secretAccessor"
#   done
#
#   # 4. Build and push:
#   gcloud builds submit --tag gcr.io/$PROJECT_ID/nexryde-backend ./backend
#
#   # 5. Deploy (production — warm instance, 1 vCPU / 512Mi, CPU throttling):
#   gcloud run services replace backend/cloudrun.service.yaml --region us-central1
#
#   # Or imperative equivalent:
#   gcloud run services update nexryde-backend --region us-central1 \
#     --min-instances=1 --max-instances=10 --cpu=1 --memory=512Mi \
#     --no-cpu-boost --cpu-throttling
##############################################################################

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nexryde-backend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        # STANDBY — primary prod is africa-south1. Keep warm-zero for rollback only.
        run.googleapis.com/startup-cpu-boost: "false"
        run.googleapis.com/cpu-throttling: "true"
        # Private access to Memorystore Redis for rate limits, realtime fanout, and polling cache.
        run.googleapis.com/vpc-access-connector: "projects/nexryde-app/locations/us-central1/connectors/nexryde-vpc"
        run.googleapis.com/vpc-access-egress: "private-ranges-only"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/nexryde-app/nexryde-backend/nexryde-backend:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 1Gi

          # ── All env vars in one flat list ─────────────────────────────────
          env:
            # Non-sensitive plain config
            - name: NEXRYDE_ENV
              value: production
            - name: DB_NAME
              value: nexryde_db
            - name: MONGO_MAX_POOL_SIZE
              value: "40"
            - name: NEXRYDE_REALTIME_PLATFORM
              value: "true"
            - name: NEXRYDE_EVENT_BUS
              value: "kafka"
            - name: NEXRYDE_OUTBOX_WORKER
              value: "false"
            # Saga replay owned by nexryde-kafka-worker
            - name: NEXRYDE_SAGA_INLINE
              value: "false"
            - name: NEXRYDE_BATCH_MATCHING
              value: "true"
            - name: NEXRYDE_MATCH_BATCH_MS
              value: "800"
            - name: NEXRYDE_STREAM_SURGE
              value: "true"
            - name: NEXRYDE_SURGE_WINDOW_SEC
              value: "60"
            - name: NEXRYDE_GUARDIANS
              value: "true"
            - name: NEXRYDE_GUARDIAN_INTERVAL_SEC
              value: "20"
            - name: KAFKA_CLIENT_ID
              value: nexryde-backend
            - name: KAFKA_SECURITY_PROTOCOL
              value: SASL_SSL
            - name: KAFKA_SASL_MECHANISM
              value: OAUTHBEARER
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: KAFKA_BOOTSTRAP_SERVERS
                  key: latest
            - name: RT_HEARTBEAT_INTERVAL_SEC
              value: "20"
            - name: JWT_EXPIRY_HOURS
              value: "24"
            - name: ADMIN_SESSION_TTL_HOURS
              value: "8"
            - name: ADMIN_MFA_REQUIRED
              value: "true"
            # Emergency SMS: after creating Secret Manager TERMII_API_KEY, add:
            #   - name: TERMII_API_KEY
            #     valueFrom: { secretKeyRef: { name: TERMII_API_KEY, key: latest } }
            #   - name: SMS_PROVIDER
            #     value: "termii"
            - name: TERMII_SENDER_ID
              value: "NEXRYDE"
            # Optional: comma-separated IPs (Cloud Run sees X-Forwarded-For). Empty = allow all.
            - name: ADMIN_IP_WHITELIST
              value: ""
            - name: ADMIN_EMAIL
              value: admin@admoblordgroup.com
            - name: CORS_ORIGINS
              value: "https://nexryde.app,https://admin.nexryde.app,exp://,nexryde://"
            # Live Squad API host is api-d.squadco.com (api.squadco.com returns 403 and breaks checkout).
            - name: SQUAD_BASE_URL
              value: "https://api-d.squadco.com"
            - name: SQUAD_CHECKOUT_BASE_URL
              value: "https://pay.squadco.com"
            - name: NEXRYDE_PUBLIC_BACKEND_URL
              value: "https://nexryde-backend-993913300770.us-central1.run.app"
            - name: SQUAD_DLQ_AUTOREPLAY
              value: "1"
            # Trusted hosts — Host-header spoofing guard (comma-separated, no scheme)
            - name: TRUSTED_HOSTS
              value: "nexryde-backend-993913300770.us-central1.run.app,nexryde.app,admin.nexryde.app"
            # NIN: NEXRYDE-only verification (no government registry delay). Set NIN_REGISTRY_ENABLED=true to opt in later.
            - name: NIN_REGISTRY_ENABLED
              value: "false"
            - name: WORK_ZONE_ENABLED
              value: "false"
            - name: WORK_ZONE_ROLLOUT_MODE
              value: "FOUNDING_DRIVERS_ONLY"
            - name: WORK_ZONE_MAX_ZONED_SHARE
              value: "0.3"
            - name: WORK_ZONE_MIN_ONLINE_DRIVERS
              value: "1"
            - name: WORK_ZONE_EARLY_ACCESS_EMAILS
              value: "loopy9ice@gmail.com,timothy_okunola@yahoo.com"
            - name: ENGAGEMENT_LOOP_ENABLED
              value: "true"
            - name: ENGAGEMENT_MAX_PER_DAY
              value: "2"
            - name: ENGAGEMENT_MIN_HOURS_BETWEEN
              value: "6"
            - name: ENGAGEMENT_QUIET_HOURS_START
              value: "22"
            - name: ENGAGEMENT_QUIET_HOURS_END
              value: "7"
            # Private driver document binaries (admin View / Download).
            - name: GCS_MEDIA_BUCKET
              value: "nexryde-media"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/secrets/firebase/firebase-service-account.json"

            # Secrets from Secret Manager
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: JWT_SECRET
                  key: latest
            - name: NIN_FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: NIN_FERNET_KEY
                  key: latest
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: MONGODB_URI
                  key: latest
            - name: SQUAD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: SQUAD_SECRET_KEY
                  key: latest
            - name: SQUAD_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: SQUAD_PUBLIC_KEY
                  key: latest
            - name: SQUAD_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: SQUAD_WEBHOOK_SECRET
                  key: latest
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ADMIN_PASSWORD
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: REDIS_URL
                  key: latest
            - name: BREVO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: BREVO_API_KEY
                  key: latest
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_MAPS_API_KEY
                  key: latest
            - name: NEXRYDE_OPS_KEY
              valueFrom:
                secretKeyRef:
                  name: NEXRYDE_OPS_KEY
                  key: latest
            - name: ADMIN_OPS_KEY
              valueFrom:
                secretKeyRef:
                  name: ADMIN_OPS_KEY
                  key: latest
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: SENTRY_DSN
                  key: latest

          volumeMounts:
            - name: firebase-service-account
              mountPath: /secrets/firebase
              readOnly: true

          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8080
            periodSeconds: 30
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12

      volumes:
        - name: firebase-service-account
          secret:
            secretName: FIREBASE_SERVICE_ACCOUNT_JSON
            items:
              - key: latest
                path: firebase-service-account.json
