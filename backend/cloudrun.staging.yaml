##############################################################################
# NEXRYDE Backend — Staging Cloud Run Service
#
# Deploy with:
#   gcloud run services replace backend/cloudrun.staging.yaml \
#     --region us-central1
#
# This service uses staging-only config:
#   - minScale 0 (scales to zero when idle)
#   - NEXRYDE_ENV=staging
#   - MONGODB_URI from Secret Manager secret MONGODB_URI_STAGING (Atlas M0 — never prod)
#   - Kafka: NEXRYDE_EVENT_BUS=kafka + KAFKA_BOOTSTRAP_SERVERS_STAGING (Managed Kafka)
#   - VPC connector required for Managed Kafka private DNS
#   - /docs enabled (not hidden)
#
# First-time Kafka (before replace):
#   ./backend/scripts/setup_managed_kafka.sh staging
#   See docs/KAFKA.md
#
# First-time staging Mongo secret:
#   echo -n "mongodb+srv://USER:PASS@STAGING_CLUSTER.mongodb.net/?appName=nexryde-staging" \
#     | gcloud secrets create MONGODB_URI_STAGING --data-file=- \
#     || gcloud secrets versions add MONGODB_URI_STAGING --data-file=-
#   # Grant nexryde-backend-staging SA: roles/secretmanager.secretAccessor on MONGODB_URI_STAGING
#
# Staging MUST use staging-only secrets (never prod JWT/admin/Squad/Redis):
#   JWT_SECRET_STAGING, ADMIN_PASSWORD_STAGING, REDIS_URL_STAGING,
#   SQUAD_SECRET_KEY_STAGING, SQUAD_PUBLIC_KEY_STAGING, SQUAD_WEBHOOK_SECRET_STAGING,
#   NEXRYDE_OPS_KEY_STAGING, ADMIN_OPS_KEY_STAGING
##############################################################################

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nexryde-backend-staging
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/startup-cpu-boost: "false"
        run.googleapis.com/cpu-throttling: "true"
        # Required for Managed Kafka (private bootstrap DNS in VPC).
        run.googleapis.com/vpc-access-connector: "projects/nexryde-app/locations/us-central1/connectors/nexryde-vpc"
        run.googleapis.com/vpc-access-egress: "private-ranges-only"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/nexryde-app/nexryde-backend/nexryde-backend:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: "500m"
              memory: 256Mi

          env:
            - name: NEXRYDE_ENV
              value: staging
            - name: DB_NAME
              value: nexryde_staging_db
            - name: MONGO_MAX_POOL_SIZE
              value: "10"
            - name: NEXRYDE_REALTIME_PLATFORM
              value: "true"
            - name: NEXRYDE_EVENT_BUS
              value: "kafka"
            - name: NEXRYDE_OUTBOX_WORKER
              value: "false"
            - name: NEXRYDE_SAGA_INLINE
              value: "false"
            - name: NEXRYDE_BATCH_MATCHING
              value: "true"
            - name: NEXRYDE_MATCH_BATCH_MS
              value: "800"
            - name: NEXRYDE_STREAM_SURGE
              value: "true"
            - name: NEXRYDE_SURGE_WINDOW_SEC
              value: "60"
            - name: KAFKA_CLIENT_ID
              value: nexryde-backend-staging
            - name: KAFKA_SECURITY_PROTOCOL
              value: SASL_SSL
            - name: KAFKA_SASL_MECHANISM
              value: OAUTHBEARER
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: KAFKA_BOOTSTRAP_SERVERS_STAGING
                  key: latest
            - name: JWT_EXPIRY_HOURS
              value: "24"
            - name: ADMIN_SESSION_TTL_HOURS
              value: "8"
            - name: ADMIN_MFA_REQUIRED
              value: "false"
            - name: ADMIN_EMAIL
              value: admin@admoblordgroup.com
            - name: CORS_ORIGINS
              value: "https://staging.nexryde.app,exp://,nexryde://"
            - name: SQUAD_BASE_URL
              value: "https://sandbox-api-d.squadco.com"
            - name: SQUAD_CHECKOUT_BASE_URL
              value: "https://sandbox-pay.squadco.com"
            - name: NEXRYDE_PUBLIC_BACKEND_URL
              value: "https://nexryde-backend-staging-993913300770.us-central1.run.app"
            - name: TRUSTED_HOSTS
              value: "nexryde-backend-staging-993913300770.us-central1.run.app,staging.nexryde.app"
            - name: ENGAGEMENT_LOOP_ENABLED
              value: "false"
            - name: DAILY_SLOT_NOTIFICATIONS_ENABLED
              value: "false"
            - name: NIN_REGISTRY_ENABLED
              value: "false"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: JWT_SECRET_STAGING
                  key: latest
            - name: NIN_FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: NIN_FERNET_KEY
                  key: latest
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: MONGODB_URI_STAGING
                  key: latest
            - name: SQUAD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: SQUAD_SECRET_KEY_STAGING
                  key: latest
            - name: SQUAD_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: SQUAD_PUBLIC_KEY_STAGING
                  key: latest
            - name: SQUAD_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: SQUAD_WEBHOOK_SECRET_STAGING
                  key: latest
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ADMIN_PASSWORD_STAGING
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: REDIS_URL_STAGING
                  key: latest
            - name: BREVO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: BREVO_API_KEY
                  key: latest
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_MAPS_API_KEY
                  key: latest
            - name: NEXRYDE_OPS_KEY
              valueFrom:
                secretKeyRef:
                  name: NEXRYDE_OPS_KEY_STAGING
                  key: latest
            - name: ADMIN_OPS_KEY
              valueFrom:
                secretKeyRef:
                  name: ADMIN_OPS_KEY_STAGING
                  key: latest

          # timeoutSeconds must be explicit — Cloud Run otherwise applies 1s,
          # which a brief event-loop stall can exceed, killing a healthy instance.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          # No readinessProbe: gating on /api/health/ready (Mongo + Redis) takes
          # every instance out of service on a dependency blip.

          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
