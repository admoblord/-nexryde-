##############################################################################
# NexRyde Backend — Staging Cloud Run Service
#
# Deploy with:
#   gcloud run services replace backend/cloudrun.staging.yaml \
#     --region us-central1
#
# This service uses staging-only config:
#   - minScale 0 (scales to zero when idle)
#   - NEXRYDE_ENV=staging
#   - MONGODB_URI from Secret Manager secret MONGODB_URI_STAGING (Atlas M0 — never prod)
#   - /docs enabled (not hidden)
#
# First-time staging Mongo secret:
#   echo -n "mongodb+srv://USER:PASS@STAGING_CLUSTER.mongodb.net/?appName=nexryde-staging" \
#     | gcloud secrets create MONGODB_URI_STAGING --data-file=- \
#     || gcloud secrets versions add MONGODB_URI_STAGING --data-file=-
#   # Grant nexryde-backend-staging SA: roles/secretmanager.secretAccessor on MONGODB_URI_STAGING
##############################################################################

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nexryde-backend-staging
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/startup-cpu-boost: "false"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/nexryde-app/nexryde-backend/nexryde-backend:staging-latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: "500m"
              memory: 256Mi

          env:
            - name: NEXRYDE_ENV
              value: staging
            - name: DB_NAME
              value: nexryde_staging_db
            - name: MONGO_MAX_POOL_SIZE
              value: "10"
            - name: JWT_EXPIRY_HOURS
              value: "24"
            - name: ADMIN_EMAIL
              value: admin@admoblordgroup.com
            - name: CORS_ORIGINS
              value: "https://staging.nexryde.app,exp://,nexryde://"
            - name: SQUAD_BASE_URL
              value: "https://sandbox-api-d.squadco.com"
            - name: SQUAD_CHECKOUT_BASE_URL
              value: "https://sandbox-pay.squadco.com"
            - name: NEXRYDE_PUBLIC_BACKEND_URL
              value: "https://nexryde-backend-staging-993913300770.us-central1.run.app"
            - name: TRUSTED_HOSTS
              value: "nexryde-backend-staging-993913300770.us-central1.run.app,staging.nexryde.app"
            - name: ENGAGEMENT_LOOP_ENABLED
              value: "false"
            - name: DAILY_SLOT_NOTIFICATIONS_ENABLED
              value: "false"
            - name: NIN_REGISTRY_ENABLED
              value: "false"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: JWT_SECRET
                  key: latest
            - name: NIN_FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: NIN_FERNET_KEY
                  key: latest
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: MONGODB_URI_STAGING
                  key: latest
            - name: SQUAD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: SQUAD_SECRET_KEY
                  key: latest
            - name: SQUAD_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: SQUAD_PUBLIC_KEY
                  key: latest
            - name: SQUAD_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: SQUAD_WEBHOOK_SECRET
                  key: latest
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ADMIN_PASSWORD
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: REDIS_URL
                  key: latest
            - name: BREVO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: BREVO_API_KEY
                  key: latest
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_MAPS_API_KEY
                  key: latest
            - name: NEXRYDE_OPS_KEY
              valueFrom:
                secretKeyRef:
                  name: NEXRYDE_OPS_KEY
                  key: latest
            - name: ADMIN_OPS_KEY
              valueFrom:
                secretKeyRef:
                  name: ADMIN_OPS_KEY
                  key: latest

          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8080
            periodSeconds: 30
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
