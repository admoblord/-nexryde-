##############################################################################
# NEXRYDE — Staging Kafka consumer / saga replayer
#
#   ./backend/scripts/setup_managed_kafka.sh staging
#   gcloud run services replace backend/cloudrun.kafka-worker.staging.yaml \
#     --region us-central1
##############################################################################

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nexryde-kafka-worker-staging
  annotations:
    run.googleapis.com/ingress: internal
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/vpc-access-connector: "projects/nexryde-app/locations/us-central1/connectors/nexryde-vpc"
        run.googleapis.com/vpc-access-egress: "private-ranges-only"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 3600
      containers:
        - image: us-central1-docker.pkg.dev/nexryde-app/nexryde-backend/nexryde-backend:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: NEXRYDE_ENV
              value: staging
            - name: NEXRYDE_SERVICE_ROLE
              value: kafka-worker
            - name: DB_NAME
              value: nexryde_staging_db
            - name: NEXRYDE_REALTIME_PLATFORM
              value: "true"
            - name: NEXRYDE_EVENT_BUS
              value: "kafka"
            - name: NEXRYDE_OUTBOX_WORKER
              value: "false"
            - name: NEXRYDE_SAGA_INLINE
              value: "false"
            - name: NEXRYDE_BATCH_MATCHING
              value: "true"
            - name: NEXRYDE_STREAM_SURGE
              value: "true"
            - name: KAFKA_CONSUMER_GROUP
              value: nexryde-replayer-staging
            - name: KAFKA_CLIENT_ID
              value: nexryde-kafka-worker-staging
            - name: KAFKA_SECURITY_PROTOCOL
              value: SASL_SSL
            - name: KAFKA_SASL_MECHANISM
              value: OAUTHBEARER
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: KAFKA_BOOTSTRAP_SERVERS_STAGING
                  key: latest
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: MONGODB_URI_STAGING
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: REDIS_URL_STAGING
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: JWT_SECRET_STAGING
                  key: latest
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
