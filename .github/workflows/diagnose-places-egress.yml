name: Diagnose Places Egress

# Cloud Run has no SSH. This job is the in-instance Google curl + NAT/firewall dump.
on:
  workflow_dispatch:
  # The loop watchdog and the 5xx reads only help if somebody looks. A wedge
  # that shuts an instance down leaves no notification of its own, and waiting
  # for the next places commit meant five days of silence. Twice a day is enough
  # to catch one and cheap enough to ignore.
  schedule:
    - cron: "17 6,18 * * *"
  push:
    branches: [main, cursor/fix-places-vpc-egress-1fc9]
    paths:
      - ".github/workflows/diagnose-places-egress.yml"
      - "backend/scripts/diagnose_and_fix_places_egress.sh"
      - "backend/places_service.py"
      # Where outbound sockets are bound to IPv4, which is what decides whether
      # egress traverses the connector and Cloud NAT at all.
      - "backend/http_client.py"
      - "backend/cloudrun.africa-south1.yaml"

permissions:
  contents: read
  id-token: write

jobs:
  diagnose-and-fix:
    name: NAT / firewall / in-process Google probe
    runs-on: ubuntu-latest
    # Opt-in while migrating off Cloud Run — scheduled runs still hit Logging +
    # Cloud Run exec. Re-enable with vars.DEPLOY_CLOUD_RUN=true, or run manually.
    if: >-
      github.event_name == 'workflow_dispatch'
      || vars.DEPLOY_CLOUD_RUN == 'true'
    environment: production
    env:
      PROJECT_ID: nexryde-app
      PROD_REGION: africa-south1
      CLOUD_RUN_SERVICE: nexryde-backend

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 1–4 dump NAT/firewall and probe Google from Cloud Run
        run: |
          chmod +x backend/scripts/diagnose_and_fix_places_egress.sh
          backend/scripts/diagnose_and_fix_places_egress.sh

      - name: 5 apply NAT all-subnets + egress ALLOW 443 (keep vpc-egress=all-traffic)
        run: backend/scripts/diagnose_and_fix_places_egress.sh --apply

      # The question we could never answer from a phone screenshot: did the
      # rider's address search reach us at all, and if it did, how long did we
      # take? The in-memory google_io deque cannot answer it — it is per
      # instance and resets on every deploy. Cloud Logging can, and this
      # service account can read it (the canary gate already does).
      - name: 6 did the phone reach us? recent address-search requests
        run: |
          set -uo pipefail
          FILTER_BASE='resource.type="cloud_run_revision" AND resource.labels.service_name="nexryde-backend"'

          echo "--- /api/places/autocomplete requests, last 3h (newest first) ---"
          gcloud logging read \
            "${FILTER_BASE} AND httpRequest.requestUrl:\"/api/places/autocomplete\"" \
            --project="${PROJECT_ID}" \
            --freshness=3h \
            --limit=40 \
            --format='table[no-heading](timestamp.date("%H:%M:%S"),httpRequest.status,httpRequest.latency,resource.labels.revision_name,httpRequest.userAgent)' \
            || echo "(log read failed — check roles/logging.viewer on the deploy SA)"

          echo
          echo "--- what our own Google call did, last 3h ---"
          gcloud logging read \
            "${FILTER_BASE} AND textPayload:\"GOOGLE_PLACES_CALL\"" \
            --project="${PROJECT_ID}" \
            --freshness=3h \
            --limit=40 \
            --format='value(timestamp.date("%H:%M:%S"),textPayload)' \
            || echo "(log read failed)"

          echo
          echo "--- any 4xx/5xx on the places routes, last 3h ---"
          gcloud logging read \
            "${FILTER_BASE} AND httpRequest.requestUrl:\"/api/places/\" AND httpRequest.status>=400" \
            --project="${PROJECT_ID}" \
            --freshness=3h \
            --limit=25 \
            --format='table[no-heading](timestamp.date("%H:%M:%S"),httpRequest.status,httpRequest.requestUrl)' \
            || echo "(log read failed)"

          # Distinguishes "the app was not used" from "the app was used and its
          # search requests never arrived". okhttp is the Android app; our own
          # harness shows up as Python-urllib and is excluded.
          echo
          echo "--- every request from a real device (okhttp), last 6h ---"
          gcloud logging read \
            "${FILTER_BASE} AND httpRequest.userAgent:\"okhttp\"" \
            --project="${PROJECT_ID}" \
            --freshness=6h \
            --limit=60 \
            --format='table[no-heading](timestamp.date("%H:%M:%S"),httpRequest.status,httpRequest.latency,httpRequest.requestUrl,httpRequest.userAgent)' \
            || echo "(log read failed)"

          # A 503 that Cloud Run reports with 30-100s of latency never entered our
          # code: it sat in the queue because no instance would take it. That is
          # what "nine seconds of silence with nothing in the application logs"
          # looks like from the outside, so these three reads are the ones that
          # tell us whether the rider was hitting a wedged instance.
          echo
          echo "--- every 5xx, last 24h (latency is queue time when it is huge) ---"
          gcloud logging read \
            "${FILTER_BASE} AND httpRequest.status>=500" \
            --project="${PROJECT_ID}" \
            --freshness=24h \
            --limit=80 \
            --format='table[no-heading](timestamp.date("%m-%d %H:%M:%S"),httpRequest.status,httpRequest.latency,httpRequest.requestUrl,resource.labels.revision_name)' \
            || echo "(log read failed)"

          echo
          echo "--- application errors/warnings, last 24h ---"
          gcloud logging read \
            "${FILTER_BASE} AND severity>=WARNING" \
            --project="${PROJECT_ID}" \
            --freshness=24h \
            --limit=60 \
            --format='value(timestamp.date("%m-%d %H:%M:%S"),severity,textPayload)' \
            || echo "(log read failed)"

          echo
          echo "--- Cloud Run instance lifecycle messages, last 24h ---"
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"nexryde-backend\" AND (textPayload:\"Container called exit\" OR textPayload:\"memory limit\" OR textPayload:\"failed to start\" OR textPayload:\"terminated\" OR textPayload:\"The request was aborted\" OR textPayload:\"upstream connect error\")" \
            --project="${PROJECT_ID}" \
            --freshness=24h \
            --limit=40 \
            --format='value(timestamp.date("%m-%d %H:%M:%S"),textPayload)' \
            || echo "(log read failed)"

          # When the event loop stops answering, Cloud Run's liveness probe kills
          # the instance and every queued request 503s. The application log goes
          # silent at that moment, so the interesting evidence is the last thing
          # it managed to write. Find the most recent probe failure and dump the
          # window leading up to it, oldest first.
          echo
          echo "--- what the app was doing before it stopped answering ---"
          WEDGE_TS="$(gcloud logging read \
            "${FILTER_BASE} AND textPayload:\"probe failed\"" \
            --project="${PROJECT_ID}" --freshness=7d --limit=1 \
            --format='value(timestamp)' 2>/dev/null || true)"
          if [ -z "${WEDGE_TS}" ]; then
            echo "(no liveness/readiness probe failure in the last 7 days)"
          else
            echo "most recent probe failure: ${WEDGE_TS}"
            START="$(date -u -d "${WEDGE_TS} - 5 minutes" +%Y-%m-%dT%H:%M:%SZ)"
            END="$(date -u -d "${WEDGE_TS} + 1 minute" +%Y-%m-%dT%H:%M:%SZ)"
            echo "window ${START} .. ${END}"
            gcloud logging read \
              "${FILTER_BASE} AND timestamp>=\"${START}\" AND timestamp<=\"${END}\"" \
              --project="${PROJECT_ID}" \
              --limit=250 \
              --order=asc \
              --format='value(timestamp.date("%H:%M:%S"),severity,textPayload,jsonPayload.message,jsonPayload.event)' \
              || echo "(log read failed)"
          fi

          echo
          echo "--- device request count by user agent, last 6h ---"
          gcloud logging read \
            "${FILTER_BASE} AND httpRequest.userAgent!=\"\"" \
            --project="${PROJECT_ID}" \
            --freshness=6h \
            --limit=400 \
            --format='value(httpRequest.userAgent)' 2>/dev/null \
            | sort | uniq -c | sort -rn | head -15 \
            || echo "(log read failed)"
