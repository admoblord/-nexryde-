name: Diagnose Places Egress

# Cloud Run has no SSH. This job is the in-instance Google curl + NAT/firewall dump.
on:
  workflow_dispatch:
  push:
    branches: [main, cursor/fix-places-vpc-egress-1fc9]
    paths:
      - ".github/workflows/diagnose-places-egress.yml"
      - "backend/scripts/diagnose_and_fix_places_egress.sh"
      - "backend/places_service.py"
      # Where outbound sockets are bound to IPv4, which is what decides whether
      # egress traverses the connector and Cloud NAT at all.
      - "backend/http_client.py"
      - "backend/cloudrun.africa-south1.yaml"

permissions:
  contents: read
  id-token: write

jobs:
  diagnose-and-fix:
    name: NAT / firewall / in-process Google probe
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: nexryde-app
      PROD_REGION: africa-south1
      CLOUD_RUN_SERVICE: nexryde-backend

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 1–4 dump NAT/firewall and probe Google from Cloud Run
        run: |
          chmod +x backend/scripts/diagnose_and_fix_places_egress.sh
          backend/scripts/diagnose_and_fix_places_egress.sh

      - name: 5 apply NAT all-subnets + egress ALLOW 443 (keep vpc-egress=all-traffic)
        run: backend/scripts/diagnose_and_fix_places_egress.sh --apply

      # The question we could never answer from a phone screenshot: did the
      # rider's address search reach us at all, and if it did, how long did we
      # take? The in-memory google_io deque cannot answer it — it is per
      # instance and resets on every deploy. Cloud Logging can, and this
      # service account can read it (the canary gate already does).
      - name: 6 did the phone reach us? recent address-search requests
        run: |
          set -uo pipefail
          FILTER_BASE='resource.type="cloud_run_revision" AND resource.labels.service_name="nexryde-backend"'

          echo "--- /api/places/autocomplete requests, last 3h (newest first) ---"
          gcloud logging read \
            "${FILTER_BASE} AND httpRequest.requestUrl:\"/api/places/autocomplete\"" \
            --project="${PROJECT_ID}" \
            --freshness=3h \
            --limit=40 \
            --format='table[no-heading](timestamp.date("%H:%M:%S"),httpRequest.status,httpRequest.latency,resource.labels.revision_name,httpRequest.userAgent)' \
            || echo "(log read failed — check roles/logging.viewer on the deploy SA)"

          echo
          echo "--- what our own Google call did, last 3h ---"
          gcloud logging read \
            "${FILTER_BASE} AND textPayload:\"GOOGLE_PLACES_CALL\"" \
            --project="${PROJECT_ID}" \
            --freshness=3h \
            --limit=40 \
            --format='value(timestamp.date("%H:%M:%S"),textPayload)' \
            || echo "(log read failed)"

          echo
          echo "--- any 4xx/5xx on the places routes, last 3h ---"
          gcloud logging read \
            "${FILTER_BASE} AND httpRequest.requestUrl:\"/api/places/\" AND httpRequest.status>=400" \
            --project="${PROJECT_ID}" \
            --freshness=3h \
            --limit=25 \
            --format='table[no-heading](timestamp.date("%H:%M:%S"),httpRequest.status,httpRequest.requestUrl)' \
            || echo "(log read failed)"

          # Distinguishes "the app was not used" from "the app was used and its
          # search requests never arrived". okhttp is the Android app; our own
          # harness shows up as Python-urllib and is excluded.
          echo
          echo "--- every request from a real device (okhttp), last 6h ---"
          gcloud logging read \
            "${FILTER_BASE} AND httpRequest.userAgent:\"okhttp\"" \
            --project="${PROJECT_ID}" \
            --freshness=6h \
            --limit=60 \
            --format='table[no-heading](timestamp.date("%H:%M:%S"),httpRequest.status,httpRequest.latency,httpRequest.requestUrl,httpRequest.userAgent)' \
            || echo "(log read failed)"

          echo
          echo "--- device request count by user agent, last 6h ---"
          gcloud logging read \
            "${FILTER_BASE} AND httpRequest.userAgent!=\"\"" \
            --project="${PROJECT_ID}" \
            --freshness=6h \
            --limit=400 \
            --format='value(httpRequest.userAgent)' 2>/dev/null \
            | sort | uniq -c | sort -rn | head -15 \
            || echo "(log read failed)"
