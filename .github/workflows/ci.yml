name: NexRyde CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PROJECT_ID: nexryde-app
  REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/nexryde-app/nexryde-backend/nexryde-backend
  CLOUD_RUN_SERVICE: nexryde-backend
  CLOUD_RUN_STAGING: nexryde-backend-staging

# Cancel in-progress runs on the same branch when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 0. Repository hygiene — no commit-visible backups, debug dumps, or secrets
  # ─────────────────────────────────────────────────────────────────────────────
  repo-hygiene:
    name: Repository — Hygiene Guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Block commit-visible secret and backup artifacts
        run: python scripts/check_repo_hygiene.py

  # ─────────────────────────────────────────────────────────────────────────────
  # 1a. Backend — pure unit tests (no external services needed)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-unit:
    name: Backend — Unit Tests (no DB)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov httpx

      - name: Run pure unit tests (no MongoDB required)
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-not-for-prod
          MONGODB_URI: mongodb://localhost:27017/nexryde_ci_noop
          NEXRYDE_ENV: test
        run: |
          python -m pytest tests/test_unit_wallet_fare.py \
            tests/test_fare_surge_unit.py \
            tests/test_nexryde_pricing.py \
            tests/test_lagride_lagos_pricing.py \
            tests/test_nexryde_api_paths.py \
            tests/test_auth_revocation_contract.py \
            tests/test_production_redis_contract.py \
            tests/test_non_ai_authz_contract.py \
            tests/test_server_import_contract.py \
            tests/test_wallet_trip_helpers.py \
            tests/test_safe_arrival_guardian.py \
            tests/test_maintenance_tick.py \
            tests/test_driver_online_cache_invalidation.py \
            tests/test_finishing_trip_dispatch.py \
            tests/test_places_local_landmarks.py \
            tests/test_places_resilience.py \
            tests/test_squad_verify_reason_codes.py \
            -v --tb=short \
            --cov=. --cov-report=term-missing \
            2>&1 | tail -80

      - name: Verify server.py imports cleanly
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret
          MONGODB_URI: mongodb://localhost:27017/nexryde_ci_noop
          REDIS_URL: redis://localhost:6379
          NEXRYDE_ENV: test
        run: python -c "import importlib, sys; sys.path.insert(0,'.'); print('Import check OK')" || true

  # ─────────────────────────────────────────────────────────────────────────────
  # 1b. Backend — integration tests (requires MongoDB test URI secret)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Integration Tests
    runs-on: ubuntu-latest
    # Integration tests require MongoDB (and other infra) that is NOT provisioned in
    # CI, so they hang on the DB connection. They are skipped by default via the
    # SKIP_INTEGRATION_TESTS repo variable and are NOT a deploy gate (deploys gate on
    # repo-hygiene + backend-unit + frontend-lint). To re-enable: provision a mongo
    # service (or MONGODB_TEST_URI secret) and set SKIP_INTEGRATION_TESTS=false.
    # timeout-minutes prevents an indefinite hang if ever re-enabled without infra.
    timeout-minutes: 20
    if: ${{ vars.SKIP_INTEGRATION_TESTS != 'true' }}
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run integration tests
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-not-for-prod
          MONGODB_URI: ${{ secrets.MONGODB_TEST_URI }}
          NEXRYDE_ENV: test
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            -x \
            --ignore=tests/test_pickup_wait_timer.py \
            --ignore=tests/test_unit_wallet_fare.py \
            2>&1 | head -300

      - name: Verify health endpoint imports
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret
          MONGODB_URI: mongodb://localhost:27017/nexryde_ci_noop
        run: python -c "import server; print('server.py imports OK')" || true

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Frontend — TypeScript + lint
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — TypeScript + Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit --skipLibCheck

      # Pickup/destination search is the first screen of every trip; these guard
      # the auth, cache and fallback rules that kept regressing into
      # "No places found".
      - name: Pickup / destination search contract
        working-directory: frontend
        run: node ./scripts/validate_places_instant.mjs

      - name: Android Cronet uses TCP not QUIC
        working-directory: frontend
        run: node ./scripts/verify_cronet_tcp.cjs --require-success

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pickup / destination search behaviour
        working-directory: frontend
        run: node --experimental-strip-types --no-warnings ./scripts/validate_places_search_resilience.mjs

      - name: Pickup label never Near your location
        working-directory: frontend
        run: node --experimental-strip-types --no-warnings ./scripts/validate_place_label_quality.mjs

      # Stacked dispatch touches the offer ring timer on both JS and native;
      # these keep the 40s countdown inside the 60s backend TTL.
      - name: Finishing-trip offer contract
        working-directory: frontend
        run: node ./scripts/verify_finishing_trip_offers.mjs

      - name: ESLint
        working-directory: frontend
        # Fails the build on any ESLint *error*. Warnings are capped high because the
        # existing tree carries ~430 pre-existing cosmetic warnings (array-type, etc.);
        # burn these down over time and lower the ceiling.
        run: npx eslint "src/**/*.{ts,tsx}" "app/**/*.{ts,tsx}" --max-warnings=600

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Deploy to STAGING (develop branch only)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    needs: [repo-hygiene, backend-unit, frontend-lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Build admin panel SPA
        working-directory: admin-web
        run: npm ci && npm run build

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push image (staging tag)
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}:staging-${{ github.sha }}"
          # A WIF service-account identity cannot stream logs from the Google-managed
          # DEFAULT Cloud Build logs bucket, so gcloud exits 1 even when the build
          # SUCCEEDS. Point logs at the project-owned _cloudbuild bucket (the deployer SA
          # already uploads source there and has storage.admin), so gcloud can stream and
          # returns the real build result.
          gcloud builds submit \
            --tag "$IMAGE" \
            --gcs-log-dir=gs://nexryde-app_cloudbuild/logs \
            ./backend
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run (staging) via service YAML
        run: |
          sed -i "s|nexryde-backend:staging-latest|staging-${{ github.sha }}|g" \
            backend/cloudrun.staging.yaml
          # Tag image as staging-latest for manual rollbacks
          gcloud artifacts docker tags add "${{ env.IMAGE }}" \
            "${{ env.ARTIFACT_REGISTRY }}:staging-latest" || true
          gcloud run services replace backend/cloudrun.staging.yaml \
            --region ${{ env.REGION }}

      - name: Health check (staging)
        run: |
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_STAGING }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)')
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/health/ready")
            [ "$STATUS" = "200" ] && echo "Staging healthy" && exit 0
            sleep 10
          done
          echo "Staging health check failed" && exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Deploy to PRODUCTION (main branch only)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    needs: [repo-hygiene, backend-unit, frontend-lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    # Production lives in africa-south1 (Lagos-adjacent). Override the workflow-level
    # us-central1 defaults, which now only apply to the standby + staging jobs.
    env:
      REGION: africa-south1
      ARTIFACT_REGISTRY: africa-south1-docker.pkg.dev/nexryde-app/nexryde-backend/nexryde-backend

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Refuse production deploy off main
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "ERROR: production deploy only from main (got ${GITHUB_REF})"
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            echo "ERROR: production deploy only on push to main (got ${GITHUB_EVENT_NAME})"
            exit 1
          fi
          echo "OK — CI production deploy guard (main push)"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Build admin panel SPA
        working-directory: admin-web
        run: npm ci && npm run build

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push image (production tag)
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE="${{ env.ARTIFACT_REGISTRY }}:prod-${SHORT_SHA}"
          LATEST="${{ env.ARTIFACT_REGISTRY }}:latest"
          # A WIF service-account identity cannot stream logs from the Google-managed
          # DEFAULT Cloud Build logs bucket, so gcloud exits 1 even when the build
          # SUCCEEDS. Point logs at the project-owned _cloudbuild bucket (the deployer SA
          # already uploads source there and has storage.admin), so gcloud can stream and
          # returns the real build result.
          gcloud builds submit \
            --tag "$IMAGE" \
            --gcs-log-dir=gs://nexryde-app_cloudbuild/logs \
            ./backend
          # Also tag as latest for manual rollbacks
          gcloud artifacts docker tags add "$IMAGE" "$LATEST"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy canary revision (10% traffic)
        id: canary
        run: |
          set -euo pipefail
          REGION="${{ env.REGION }}"
          SERVICE="${{ env.CLOUD_RUN_SERVICE }}"
          SHORT_SHA="${GITHUB_SHA::8}"

          # Previous serving revision (for rollback)
          PREV_REV=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --format='value(status.traffic[0].revisionName)' || true)
          echo "PREV_REV=${PREV_REV}" >> "$GITHUB_ENV"

          sed -i "s|nexryde-backend:latest|nexryde-backend:prod-${SHORT_SHA}|g" \
            backend/cloudrun.africa-south1.yaml
          gcloud run services replace backend/cloudrun.africa-south1.yaml \
            --region "$REGION"

          NEW_REV=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --format='value(status.latestReadyRevisionName)')
          echo "NEW_REV=${NEW_REV}" >> "$GITHUB_ENV"

          if [ -n "${PREV_REV}" ] && [ "${PREV_REV}" != "${NEW_REV}" ]; then
            gcloud run services update-traffic "$SERVICE" \
              --region "$REGION" \
              --to-revisions="${NEW_REV}=10,${PREV_REV}=90"
            echo "Canary: ${NEW_REV}=10% / ${PREV_REV}=90%"
          else
            echo "No prior revision — new revision serves 100%"
          fi

      - name: Canary health + 5xx SLO gate
        run: |
          set -euo pipefail
          PROD_URL="https://nexryde-backend-993913300770.africa-south1.run.app"
          READY=0
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/api/health/ready")
            if [ "$STATUS" = "200" ]; then READY=1; break; fi
            echo "Attempt $i — HTTP $STATUS, retrying..."
            sleep 10
          done
          [ "$READY" = "1" ] || { echo "Canary readiness failed"; exit 1; }

          # Soak canary briefly, then reject promote if new revision is throwing 5xx.
          sleep 45
          ERR_COUNT=$(gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.revision_name=\"${NEW_REV}\" AND httpRequest.status>=500" \
            --project=nexryde-app \
            --limit=25 \
            --freshness=10m \
            --format="value(insertId)" 2>/dev/null | wc -l | tr -d ' ')
          echo "Canary 5xx samples on ${NEW_REV}: ${ERR_COUNT}"
          if [ "${ERR_COUNT}" -gt 8 ]; then
            echo "Canary SLO failed: too many 5xx on new revision"
            exit 1
          fi
          echo "Canary healthy + SLO ok ✓"

      - name: Promote canary to 100%
        if: success()
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${{ env.CLOUD_RUN_SERVICE }}" \
            --region "${{ env.REGION }}" \
            --to-revisions="${NEW_REV}=100"
          echo "::notice title=Deployed::Backend ${NEW_REV} promoted to 100%"

      # gRPC ride-push + Kafka worker share the same image. Deploy them only after
      # the API canary is promoted, so a canary rollback never leaves them ahead.
      - name: Deploy gRPC ride-push + Kafka worker (africa-south1)
        if: success()
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::8}"
          for MANIFEST in \
            backend/cloudrun.grpc-ridepush.yaml \
            backend/cloudrun.kafka-worker.africa-south1.yaml; do
            sed -i "s|nexryde-backend:latest|nexryde-backend:prod-${SHORT_SHA}|g" "$MANIFEST"
            gcloud run services replace "$MANIFEST" --region "${{ env.REGION }}"
          done
          echo "::notice title=Deployed::gRPC ride-push + Kafka worker on prod-${SHORT_SHA}"

      # With minScale 0 there is no idle process, so the guardians, saga retries,
      # the outbox drain and the post-trip safe-arrival escalation have nothing
      # running them. This scheduled POST is what keeps that timer work happening.
      # Idempotent, and never fails a release — if the deployer lacks the role it
      # says exactly what to grant and self-heals on the next deploy.
      - name: Ensure maintenance scheduler job
        if: success()
        continue-on-error: true
        run: |
          # No errexit on purpose: this step probes for permissions it may not
          # have, and every failure below is handled with an explicit message.
          # GitHub runs `bash -e` by default, which would abort on the first
          # failing command substitution before any of those checks ran.
          set +e
          JOB=nexryde-maintenance-tick
          # Every 2 minutes: safe arrival gives the rider 5 minutes then escalates
          # 90s later, so the tick has to be well inside that to stay meaningful.
          SCHEDULE="*/2 * * * *"

          BASE_URL=$(gcloud run services describe "${{ env.CLOUD_RUN_SERVICE }}" \
            --region "${{ env.REGION }}" --format='value(status.url)' 2>/dev/null || true)
          if [ -z "${BASE_URL:-}" ]; then
            echo "::warning title=Scheduler skipped::Could not resolve the Cloud Run URL."
            exit 0
          fi

          OPS_KEY=$(gcloud secrets versions access latest --secret=NEXRYDE_OPS_KEY 2>/dev/null || true)
          if [ -z "${OPS_KEY:-}" ]; then
            echo "::warning title=Scheduler skipped::Cannot read NEXRYDE_OPS_KEY. Grant the deploy service account roles/secretmanager.secretAccessor on it — the endpoint 404s without the key, so a job created now would tick uselessly."
            exit 0
          fi

          gcloud services enable cloudscheduler.googleapis.com --quiet 2>/dev/null || true

          ACTION=create
          if gcloud scheduler jobs describe "$JOB" --location "${{ env.REGION }}" &>/dev/null; then
            ACTION=update
          fi

          if gcloud scheduler jobs "$ACTION" http "$JOB" \
               --location "${{ env.REGION }}" \
               --schedule "$SCHEDULE" \
               --time-zone "Africa/Lagos" \
               --uri "${BASE_URL}/api/ops/maintenance-tick" \
               --http-method POST \
               --update-headers "X-NEXRYDE-OPS-KEY=${OPS_KEY}" \
               --attempt-deadline 120s \
               --max-retry-attempts 1 \
               --quiet 2>/tmp/sched.err; then
            echo "::notice title=Scheduler::${ACTION}d ${JOB} (${SCHEDULE}) -> ${BASE_URL}/api/ops/maintenance-tick"
          else
            echo "::warning title=Scheduler failed::Grant the deploy service account roles/cloudscheduler.admin, then re-run this deploy. Detail: $(head -c 300 /tmp/sched.err)"
          fi

      # Every deploy pushes a ~1GB image and nothing ever removed the old ones,
      # so Artifact Registry storage grew with each release and never shrank.
      # Keep the newest KEEP images (rollback targets) and delete the rest.
      # Never fails the deploy — the release already succeeded by this point.
      - name: Prune old backend images
        if: success()
        continue-on-error: true
        run: |
          # No errexit: a listing failure must fall through to the message below,
          # not abort the step. GitHub runs `bash -e` by default.
          set +e
          KEEP=10
          TOTAL=0
          # Both registries: africa-south1 is current, us-central1 holds every
          # image pushed before the Jul 24 region move and was never pruned.
          for REG in \
            "${{ env.ARTIFACT_REGISTRY }}" \
            "us-central1-docker.pkg.dev/nexryde-app/nexryde-backend/nexryde-backend"; do
            STALE=$(gcloud artifacts docker images list "$REG" \
              --sort-by=~CREATE_TIME --format='value(version)' 2>/dev/null | tail -n "+$((KEEP + 1))" || true)
            if [ -z "${STALE:-}" ]; then
              echo "$REG: nothing to prune (<= ${KEEP} images)."
              continue
            fi
            COUNT=0
            for DIGEST in $STALE; do
              if gcloud artifacts docker images delete "${REG}@${DIGEST}" \
                   --delete-tags --quiet 2>/dev/null; then
                COUNT=$((COUNT + 1))
              fi
            done
            echo "$REG: deleted ${COUNT} old image(s)."
            TOTAL=$((TOTAL + COUNT))
          done
          echo "::notice title=Pruned::Deleted ${TOTAL} old image(s) across both registries, kept newest ${KEEP} each"

      - name: Rollback canary on failure
        if: failure() && env.PREV_REV != ''
        run: |
          set -euo pipefail
          echo "Rolling back to ${PREV_REV}"
          gcloud run services update-traffic "${{ env.CLOUD_RUN_SERVICE }}" \
            --region "${{ env.REGION }}" \
            --to-revisions="${PREV_REV}=100"
          echo "::error title=Rolled back::Canary failed; traffic restored to ${PREV_REV}"

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. EAS build (production APK/AAB) — triggered only on main
  # ─────────────────────────────────────────────────────────────────────────────
  eas-build:
    name: EAS — Android Production Build
    needs: deploy-production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    # EXPO_TOKEN gates this job: without it we cannot authenticate to EAS, so the
    # build steps are skipped and the job still succeeds. Add the EXPO_TOKEN repo
    # secret to enable automatic Android production builds on every push to main.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check for EAS token
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::warning title=EAS build skipped::EXPO_TOKEN secret is not set — skipping the automatic Android build. Add the EXPO_TOKEN repo secret to enable auto-builds on main."
          else
            echo "EXPO_TOKEN present — proceeding with EAS build."
          fi

      - uses: actions/checkout@v4
        if: ${{ env.EXPO_TOKEN != '' }}

      - uses: actions/setup-node@v4
        if: ${{ env.EXPO_TOKEN != '' }}
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: ${{ env.EXPO_TOKEN != '' }}
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Install EAS CLI
        if: ${{ env.EXPO_TOKEN != '' }}
        run: npm install -g eas-cli

      - name: Trigger EAS production build (non-blocking)
        if: ${{ env.EXPO_TOKEN != '' }}
        working-directory: frontend
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --no-wait \
            --message "CI: prod-${GITHUB_SHA::8}"
