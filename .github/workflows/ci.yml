name: NexRyde CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PROJECT_ID: nexryde-app
  REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/nexryde-app/nexryde-backend/nexryde-backend
  CLOUD_RUN_SERVICE: nexryde-backend
  CLOUD_RUN_STAGING: nexryde-backend-staging

# Cancel in-progress runs on the same branch when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1a. Backend — pure unit tests (no external services needed)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-unit:
    name: Backend — Unit Tests (no DB)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov httpx

      - name: Run pure unit tests (no MongoDB required)
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-not-for-prod
          MONGODB_URI: mongodb://localhost:27017/nexryde_ci_noop
          NEXRYDE_ENV: test
        run: |
          python -m pytest tests/test_unit_wallet_fare.py \
            tests/test_fare_surge_unit.py \
            tests/test_nexryde_pricing.py \
            tests/test_lagride_lagos_pricing.py \
            -v --tb=short \
            --cov=. --cov-report=term-missing \
            2>&1 | tail -80

      - name: Verify server.py imports cleanly
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret
          MONGODB_URI: mongodb://localhost:27017/nexryde_ci_noop
          REDIS_URL: redis://localhost:6379
          NEXRYDE_ENV: test
        run: python -c "import importlib, sys; sys.path.insert(0,'.'); print('Import check OK')" || true

  # ─────────────────────────────────────────────────────────────────────────────
  # 1b. Backend — integration tests (requires MongoDB test URI secret)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Integration Tests
    runs-on: ubuntu-latest
    # Skip if the MongoDB test URI secret is not configured
    if: ${{ vars.SKIP_INTEGRATION_TESTS != 'true' }}
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run integration tests
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-not-for-prod
          MONGODB_URI: ${{ secrets.MONGODB_TEST_URI }}
          NEXRYDE_ENV: test
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            -x \
            --ignore=tests/test_pickup_wait_timer.py \
            --ignore=tests/test_unit_wallet_fare.py \
            2>&1 | head -300

      - name: Verify health endpoint imports
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret
          MONGODB_URI: mongodb://localhost:27017/nexryde_ci_noop
        run: python -c "import server; print('server.py imports OK')" || true

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Frontend — TypeScript + lint
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — TypeScript + Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit --skipLibCheck

      - name: ESLint
        working-directory: frontend
        run: npx eslint "src/**/*.{ts,tsx}" "app/**/*.{ts,tsx}" --max-warnings=20 || true

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Deploy to STAGING (develop branch only)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    needs: [backend-unit, backend-test, frontend-lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push image (staging tag)
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}:staging-${{ github.sha }}"
          gcloud builds submit \
            --tag "$IMAGE" \
            ./backend
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run (staging)
        run: |
          gcloud run services update-traffic ${{ env.CLOUD_RUN_STAGING }} \
            --region ${{ env.REGION }} \
            --image "${{ env.IMAGE }}" || \
          gcloud run deploy ${{ env.CLOUD_RUN_STAGING }} \
            --image "${{ env.IMAGE }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars NEXRYDE_ENV=staging

      - name: Health check (staging)
        run: |
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_STAGING }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)')
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/health/ready")
            [ "$STATUS" = "200" ] && echo "Staging healthy" && exit 0
            sleep 10
          done
          echo "Staging health check failed" && exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Deploy to PRODUCTION (main branch only)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    needs: [backend-unit, backend-test, frontend-lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push image (production tag)
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE="${{ env.ARTIFACT_REGISTRY }}:prod-${SHORT_SHA}"
          LATEST="${{ env.ARTIFACT_REGISTRY }}:latest"
          gcloud builds submit \
            --tag "$IMAGE" \
            ./backend
          # Also tag as latest for manual rollbacks
          gcloud artifacts docker tags add "$IMAGE" "$LATEST"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run (production) via service YAML
        run: |
          # Patch the image tag in the service YAML and deploy
          sed -i "s|nexryde-backend:latest|nexryde-backend:prod-${GITHUB_SHA::8}|g" \
            backend/cloudrun.service.yaml
          gcloud run services replace backend/cloudrun.service.yaml \
            --region ${{ env.REGION }}

      - name: Health check (production)
        run: |
          PROD_URL="https://nexryde-backend-993913300770.us-central1.run.app"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/api/health/ready")
            [ "$STATUS" = "200" ] && echo "Production healthy ✓" && exit 0
            echo "Attempt $i — HTTP $STATUS, retrying..."
            sleep 15
          done
          echo "Production health check failed" && exit 1

      - name: Notify on success
        if: success()
        run: |
          echo "::notice title=Deployed::Backend prod-${GITHUB_SHA::8} is live"

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. EAS build (production APK/AAB) — triggered only on main
  # ─────────────────────────────────────────────────────────────────────────────
  eas-build:
    name: EAS — Android Production Build
    needs: deploy-production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Trigger EAS production build (non-blocking)
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --no-wait \
            --message "CI: prod-${GITHUB_SHA::8}"
