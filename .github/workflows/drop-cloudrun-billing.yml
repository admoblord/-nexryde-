name: Drop Cloud Run Billing

# One-shot (and repeatable) teardown of billed Google hosting.
# Triggered by a main push whose commit subject contains [drop-cloudrun],
# or manually via workflow_dispatch.
#
# Deletes: Cloud Run services (africa-south1 + us-central1), Memorystore,
# VPC connectors, Managed Kafka, Cloud Scheduler jobs, stale AR images.
# Does NOT touch Atlas (needs Atlas API keys) — run atlas_drop_cloudrun_nat.sh
# separately after Emergent egress is allowlisted.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/drop-cloudrun-billing.yml"
      - "backend/scripts/cleanup_idle_cloud_spend.sh"

permissions:
  contents: read
  id-token: write

concurrency:
  group: drop-cloudrun-billing
  cancel-in-progress: false

jobs:
  drop:
    name: Delete Cloud Run / VPC / Memorystore / Scheduler
    runs-on: ubuntu-latest
    # No GitHub Environment gate — user asked to delete billing now; WIF secrets
    # are repo-level (same ones the former Cloud Run deploy used).
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message || '', '[drop-cloudrun]')
    env:
      PROJECT_ID: nexryde-app
      GCP_PROJECT: nexryde-app

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Preflight — list what will be deleted
        run: |
          set -uo pipefail
          echo "=== africa-south1 Cloud Run ==="
          gcloud run services list --region=africa-south1 --project="$PROJECT_ID" \
            --format='table(metadata.name,status.url,status.conditions[0].status)' || true
          echo "=== us-central1 Cloud Run ==="
          gcloud run services list --region=us-central1 --project="$PROJECT_ID" \
            --format='table(metadata.name,status.url)' || true
          echo "=== Memorystore ==="
          gcloud redis instances list --region=africa-south1 --project="$PROJECT_ID" \
            --format='table(name,tier,memorySizeGb)' || true
          echo "=== VPC connectors ==="
          gcloud compute networks vpc-access connectors list --region=africa-south1 \
            --project="$PROJECT_ID" --format='table(name,state)' || true
          gcloud compute networks vpc-access connectors list --region=us-central1 \
            --project="$PROJECT_ID" --format='table(name,state)' || true
          echo "=== Scheduler ==="
          gcloud scheduler jobs list --location=africa-south1 --project="$PROJECT_ID" \
            --format='table(name,schedule,state)' || true
          gcloud scheduler jobs list --location=us-central1 --project="$PROJECT_ID" \
            --format='table(name,schedule,state)' || true

      - name: Delete billed resources
        run: |
          set -euo pipefail
          chmod +x backend/scripts/cleanup_idle_cloud_spend.sh
          backend/scripts/cleanup_idle_cloud_spend.sh --apply --drop-cloudrun --drop-standby

      - name: Postflight — confirm Cloud Run is gone
        run: |
          set -uo pipefail
          FAIL=0
          for REGION in africa-south1 us-central1; do
            LEFT="$(gcloud run services list --region="$REGION" --project="$PROJECT_ID" \
                      --format='value(metadata.name)' 2>/dev/null || true)"
            if [[ -n "$LEFT" ]]; then
              echo "::error title=Cloud Run still present::$REGION still has: $LEFT"
              FAIL=1
            else
              echo "OK — no Cloud Run services in $REGION"
            fi
          done
          echo "Probe old production URL:"
          CODE="$(curl -sS -m 15 -o /dev/null -w '%{http_code}' \
            https://nexryde-backend-993913300770.africa-south1.run.app/api/health || true)"
          echo "  HTTP $CODE (expect 404/not found once DNS/revision are gone)"
          exit "$FAIL"
