// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    classpath('com.google.gms:google-services:4.4.2')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
  // Navigation SDK bundles Maps SDK — exclude standalone play-services-maps
  // from react-native-maps / other transitive deps to avoid duplicate classes.
  configurations {
    implementation {
      exclude group: 'com.google.android.gms', module: 'play-services-maps'
    }
  }
}

// react-native-maps still needs Maps compile APIs; supply them via Navigation SDK
// (same artifact version as @googlemaps/react-native-navigation-sdk).
subprojects { sub ->
  if (sub.name == 'react-native-maps') {
    sub.afterEvaluate {
      sub.dependencies.add(
        'implementation',
        'com.google.android.libraries.navigation:navigation:7.6.1'
      )
    }
  }
}

// @generated begin nexryde-16kb-page-size
// NDK r28+ defaults to 16 KB ELF alignment for from-source native builds.
ext {
    ndkVersion = "28.2.13676358"
}

// Only the native AAR is pinned. Rewriting the whole group breaks
// datastore-guava (Navigation SDK), which has no 1.1.7 artifact.
allprojects { project ->
    project.configurations.configureEach { configuration ->
        configuration.resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.datastore'
                    && details.requested.name == 'datastore-core-android') {
                details.useVersion('1.1.7')
                details.because('Play 16KB: pin datastore-core-android NDK r25c .so')
            }
        }
        configuration.resolutionStrategy.force(
            'androidx.datastore:datastore-core-android:1.1.7'
        )
    }
}
// @generated end nexryde-16kb-page-size

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
